# Estudo curto de learning rate (Seção 9 do plano, busca limitada). REGISTRADO ANTES DE RODAR (04/11/2026).
objetivo: justificar o learning rate inicial do AdamW antes dos treinos E01–E04 (Seção 5.3 do plano).
motivo: >
  O valor 0,01 vem do protocolo do artigo YOLO-ASPE e é o lr0 padrão do Ultralytics para SGD/MuSGD. Para AdamW, o
  Ultralytics (optimizer=auto) usaria 0,002*5/(4+nc) = 0,000714 com nc=12, e a documentação indica lr0 típico de 1e-3
  para Adam. Nos treinos anteriores com 0,01 as variâncias do BatchNorm chegaram a >65.504 (limite do fp16).
modelo: YOLOv8s (E01), pesos yolov8s.pt, sem ASPE
dataset: data/processed/agropest12_plano (split final congelado; usa APENAS a validação)
fixo: {epochs: 60, close_mosaic: 10 (mesma proporção 50/300), patience: 60, optimizer: AdamW, lrf: 0.01, cos_lr: true,
       warmup_epochs: 3, weight_decay: 0.0005, batch: 16, imgsz: 640, seed: 42, augmentation: A01 (protocolo)}
valores_de_lr0: [0.01, 0.002, 0.001, 0.0007]   # 0.0007 = valor do optimizer=auto do Ultralytics para nc=12
orcamento: 4 treinos de 60 épocas (~1,5 h cada)
hipotese: >
  lr0=0,01 é alto demais para AdamW e deve produzir mAP50-95 de validação menor ou igual ao de lr0 em [0,0007; 0,002],
  além de normas de BatchNorm instáveis. Refutável: se 0,01 empatar ou vencer, mantém-se o valor do artigo.
criterio_de_decisao: >
  Melhor fitness (0,1*mAP50 + 0,9*mAP50-95) de validação do melhor checkpoint. Se a diferença entre o melhor e outro
  valor for menor que 0,005 (ordem do desvio entre seeds observado, 0,001-0,003), escolhe-se o lr0 mais próximo da
  referência da documentação para AdamW (0,001). O teste NÃO é usado.
depois: congelar o lr0 escolhido em configs/protocolo_plano.yaml e registrar o estudo (todas as tentativas) no TCC.
