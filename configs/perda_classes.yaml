# Modificações na função de perda (weighted loss e Focal Loss) — REGISTRADO EM 18/11/2026, ANTES DO TREINO.
# ATENÇÃO: experimento POSTERIOR à avaliação final no teste (configs/teste_final.yaml). Decisão só na VALIDAÇÃO;
# o teste, se usado, é reportado como análise complementar pós-teste e não altera nenhuma conclusão já registrada.
motivacao: >
  O TCC1 previa perda ponderada (E4) e Focal Loss (E5). Crasto (2024) relata que a reponderação da perda foi pouco
  eficaz no YOLOv5 (COCO-ZIPF). Aqui se verifica se isso vale para o YOLO26s-ASPE residual (E05), nas duas bases,
  comparando com o próprio E05 seed 42 e com as técnicas de dados já avaliadas (MIX, RFS, CP, RFS+CP, só no IP102).
modelo: E05 = YOLO26s-ASPE residual (E04 --aspe-res), protocolo configs/protocolo_plano.yaml (A01), seed 42
variantes:
  W:
    descricao: weighted loss nativa do Ultralytics 8.4 (cls_pw); BCE da classe c multiplicada por w_c = (1/n_c)^cls_pw, média 1
    cls_pw: 0.5
    justificativa: >
      raiz do inverso da frequência (mesma suavização do RFS, Gupta et al. 2019). Com cls_pw = 1 os pesos no IP102 iriam
      de 0,006 a 12,3 (razão ~2000), o que tende a desestabilizar o treino; com 0,5 vão de 0,12 a 5,3 (razão 44).
      No AgroPest-12 (2,4:1) os pesos ficam entre 0,74 e 1,15: espera-se efeito pequeno (controle).
  FL:
    descricao: Focal Loss (Lin et al., ICCV 2017) no lugar da BCE de classificação, nos dois ramos do YOLO26 (one2many e one2one)
    gamma: 2.0
    alpha: 0.25
    justificativa: valores recomendados pelo artigo original (melhor combinação no COCO); nenhum ajuste posterior
runs:
  - python scripts/treinar_plano.py E04 --aspe-res --perda W                        # AgroPest  -> plano_E04_s42_ares_W
  - python scripts/treinar_plano.py E04 --aspe-res --perda FL                       # AgroPest  -> plano_E04_s42_ares_FL
  - python scripts/treinar_plano.py E04 --aspe-res --perda W --dataset ip102_limpo  # IP102     -> ip102_limpo_E04_s42_ares_W
  - python scripts/treinar_plano.py E04 --aspe-res --perda FL --dataset ip102_limpo # IP102     -> ip102_limpo_E04_s42_ares_FL
referencia_val_fp32:
  agropest_E05_s42: {mAP50: 0.7709, mAP50_95: 0.4682, fitness: 0.4985}
  agropest_E05_dp_3_seeds: 0.0048
  ip102_E05_s42: {mAP50: 0.6026, mAP50_95: 0.3866, fitness: 0.4082}
  ip102_E05_dp_3_seeds: 0.0099
  ip102_outras_tecnicas_s42_fitness: {MIX: 0.4015, RFS: 0.3905, CP: 0.3871, RFS_CP: 0.3811, NorCal_g0.2: 0.4123}
hipoteses:
  H1_crasto: >
    Seguindo Crasto (2024), nenhuma das duas modificações supera o E05 seed 42 na validação por mais que o ruído
    (fitness > E05 + 0,005) em nenhuma das bases. Refutada se W ou FL tiver fitness > E05 s42 + 0,005.
  H2_raras_ip102: >
    No IP102, W e/ou FL elevam a AP@0,5:0,95 da faixa rara (validação) em mais de 0,02 em relação ao E05 s42
    (mesmo limiar de configs/seed2.yaml), possivelmente às custas das classes frequentes.
limites: seed única (dp do E05 entre seeds = 0,005 no AgroPest e 0,010 no IP102); diferenças menores que isso não são conclusivas
efeito_conhecido_FL: >
  Verificado na CPU antes do treino (lote sintético, YOLO26s-ASPE residual): a FL reduz a perda de classificação de
  20,2 para 1,1 (box e dfl iguais), porque a maioria das posições são negativos fáceis e alpha = 0,25. O ganho cls = 0,5
  do protocolo NÃO foi reajustado (seguiu-se a FL original, sem ajuste); isso faz parte do que está sendo testado.
resultados_val_fp32:   # python scripts/avaliar_plano.py val <run>
  agropest_W:   # 19/11/2026; melhor época 70, parada antecipada na 113
    run: plano_E04_s42_ares_W
    mAP50: 0.7711
    mAP50_95: 0.4692
    P: 0.848
    R: 0.728
    fitness: 0.4994   # E05 s42 0,4985 -> +0,0009 (abaixo do dp 0,0048)
    veredito: H1 mantida (fitness <= 0,5035). Empate com o E05, como esperado com pesos entre 0,74 e 1,15.
  agropest_FL:   # 19/11/2026; foi até a época 300 (sem parada antecipada), melhor época 270
    run: plano_E04_s42_ares_FL
    mAP50: 0.6102
    mAP50_95: 0.3895
    P: 0.667
    R: 0.580
    fitness: 0.4116   # E05 s42 0,4985 -> -0,0869 (~18 dp)
    veredito: >
      H1 mantida (fitness <= 0,5035), com piora grande. Aprendizado muito lento (fitness 0,055 na época 10 contra 0,353
      do E05; ainda subindo na 270). Precisão 0,667 contra ~0,85 do E05: a classificação foi a parte prejudicada, coerente
      com a perda de classificação ~20x menor (efeito_conhecido_FL) sem reajuste do ganho cls.
  ip102_W:   # 20/11/2026; melhor época 75 (índice 74), parada antecipada na 125. Avaliado na CPU (fp32, mesmo validador),
             # porque a GPU estava ocupada pelo treino FL; script: scratchpad avaliar_cpu.py (formato de avaliar_plano.py)
    run: ip102_limpo_E04_s42_ares_W
    mAP50: 0.5622
    mAP50_95: 0.3579
    P: 0.611
    R: 0.490
    fitness: 0.3783   # E05 s42 0,4082 -> -0,0299 (~3 dp das seeds do E05 no IP102)
    faixas_ap50_95:   # raras / comuns / frequentes (17 / 47 / 31 classes presentes na val)
      W: [0.249, 0.349, 0.431]
      E05_s42: [0.334, 0.361, 0.455]
      E03_s42: [0.241, 0.368, 0.456]
    veredito: >
      H1 mantida (fitness <= 0,4132), com piora de ~3 dp. H2 refutada: AP50-95 das raras 0,249 contra 0,334 do E05 s42
      (-0,085; mesmo contra o E03 s42, 0,241, o ganho é de só +0,008, abaixo do limiar de 0,02). As frequentes também caíram
      (0,455 -> 0,431) e a revocação caiu (0,529 -> 0,490), sem ganho de precisão (0,609 -> 0,611). Ficou abaixo das quatro
      técnicas de dados (MIX 0,4015; RFS 0,3905; CP 0,3871; RFS+CP 0,3811). Coerente com Crasto (2024): reponderar a perda
      não ajudou o detector de um estágio. Ressalva: a faixa rara do E05 s42 na val (0,334) é atípica (E03 0,241; demais
      técnicas 0,233-0,254), então a comparação contra o E03 é a mais informativa para as raras.
  ip102_FL_PARCIAL:   # 20/11/2026 — LEITURA PARCIAL, NÃO É O RESULTADO OFICIAL. Cópia do best_fp32.pt na época 134 (índice 133),
                      # com o treino ainda em andamento; avaliada na CPU (fp32, mesmo validador). Nada gravado em plano_val.json.
    run: ip102_limpo_E04_s42_ares_FL
    epoca: 134
    mAP50: 0.3152
    mAP50_95: 0.2087
    P: 0.385
    R: 0.374
    fitness: 0.2193   # E05 s42 0,4082
    faixas_ap50_95: [0.066, 0.180, 0.330]   # raras / comuns / frequentes; E03 s42: 0,241 / 0,368 / 0,456
    leitura: >
      A queda é maior quanto mais rara a faixa (contra o E03: raras -73%, comuns -51%, frequentes -28%): o oposto do efeito
      pretendido. Com alpha = 0,25 e o ganho cls inalterado, os poucos positivos das classes raras quase não geram sinal de
      aprendizado. Curva ainda subindo (~+0,02 de fitness a cada 30 épocas); projeção para a época 300: 0,25-0,30.

