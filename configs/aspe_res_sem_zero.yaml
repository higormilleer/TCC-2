# Ablação do ASPE residual: soma residual SEM inicialização em zero — REGISTRADO EM 18/11/2026, ANTES DO TREINO.
# ATENÇÃO: experimento POSTERIOR à avaliação final no teste (configs/teste_final.yaml). Decisão só na VALIDAÇÃO;
# o teste, se usado, é reportado como análise complementar pós-teste e não altera nenhuma conclusão já registrada.
motivacao: >
  O E05 (ASPE residual) difere do E04 (ASPE do artigo) em DOIS pontos ao mesmo tempo: (a) a soma residual y + ASPE(y) e
  (b) a inicialização em zero do gama e do beta da última BN do ASPE (cv3.bn), que faz o bloco começar como identidade.
  Esta ablação mantém (a) e retira (b): o ASPE começa com a inicialização padrão (gama = 1, beta = 0), de modo que, no
  início, a rede recebe y + ruído (verificado na CPU: saída inicial difere do YOLO26s puro, diferença média 2,04; com zero
  a saída é idêntica). Pergunta: o ganho do E05 vem de preservar o pré-treino (início em zero) ou da soma em si?
modelo: YOLO26s + ASPE residual sem zero-init (E04 --aspe-res --sem-zero), protocolo configs/protocolo_plano.yaml (A01), seed 42
runs:
  - python scripts/treinar_plano.py E04 --aspe-res --sem-zero                        # AgroPest -> plano_E04_s42_ares_nz
  - python scripts/treinar_plano.py E04 --aspe-res --sem-zero --dataset ip102_limpo  # IP102    -> ip102_limpo_E04_s42_ares_nz
referencia_val_fp32:   # fitness = 0,1*mAP50 + 0,9*mAP50-95 (runs/val_eval/plano_val.json)
  agropest: {E03: 0.4821, E04: 0.4819, E05: 0.4985, dp_E05_seeds: 0.0048}
  ip102:    {E03: 0.3944, E04: 0.3471, E05: 0.4082, dp_E05_seeds: 0.0099}
  fitness_no_treino_epoca_10:   # results.csv (validação do Ultralytics durante o treino)
    agropest: {E03: 0.331, E04: 0.242, E05: 0.353}
    ip102:    {E03: 0.196, E04: 0.095, E05: 0.205}
regra_de_decisao:   # na fitness da validação fp32 (avaliar_plano.py val)
  soma_basta: "NZ >= E05 - dp  (AgroPest >= 0,4937; IP102 >= 0,3983): a soma residual sozinha explica o ganho"
  zero_necessario: "NZ <= E04 + dp (AgroPest <= 0,4867; IP102 <= 0,3570): sem o início em zero o ganho some"
  intermediario: "entre os dois limiares: os dois ingredientes contribuem"
hipotese: >
  Seguindo Kumar et al. (ICLR 2022) e He et al. (CVPR 2019, zero-gamma), o início em zero é o ingrediente principal:
  espera-se NZ abaixo do E05 por mais que o dp nas duas bases, com efeito maior no IP102 (onde E04 perde 0,061 para o E05,
  contra 0,017 no AgroPest). Secundária: na época 10, a fitness do NZ fica mais perto do E04 que do E05 (atraso inicial).
  Refutada se NZ >= E05 - dp nas duas bases.
limites: >
  Seed única. No AgroPest a diferença E04 x E05 (0,017) é só ~3,5 dp, então um resultado intermediário é provável e deve
  ser lido com cautela; o IP102 é a base em que a ablação discrimina melhor.
nota_correcao_retomada: >
  Junto com esta ablação foi corrigida a retomada (resume) dos treinos com ASPE (src/tcc/models/yolo_aspe.py,
  _carregar_depois): antes, ao retomar, o ASPE do modelo vivo voltava ao estado inicial (só o EMA guardava o ASPE
  treinado). Treinos novos não mudam (verificado: pesos iniciais idênticos ao código antigo com a mesma seed).
  Rodadas afetadas (retomadas antes da melhor época): plano_E04_s42_ares (ép. 23 de 61), plano_E02_s42_afig2 (ép. 14
  de 59), ip102_limpo_E04_s43_ares_repro (ép. 50 de 92), ip102_limpo_E04_s42_ares (ép. 3 de 53, efeito desprezível).

# ---- RESULTADO (validação fp32), registrado em 23/11/2026 ----
resultado:
  agropest: {run: plano_E04_s42_ares_nz, fitness: 0.4896, mAP50: 0.7480, mAP50_95: 0.4608, epoca_melhor: 61, fitness_epoca_10: 0.268,
             fracao_do_ganho_E04_E05: 0.46, veredito: intermediario}
  ip102: {run: ip102_limpo_E04_s42_ares_nz, fitness: 0.3794, mAP50: 0.5588, mAP50_95: 0.3594, epoca_melhor: 138, fitness_epoca_10: 0.151,
          faixas_raras_comuns_frequentes: [0.255, 0.343, 0.442], fracao_do_ganho_E04_E05: 0.53, veredito: intermediario}
  conclusao: >
    Intermediário nas duas bases: a soma residual sozinha recupera cerca de metade da distância entre E04 e E05, e o
    início em zero responde pela outra metade. No IP102 o NZ fica abaixo do E03 (0,3794 x 0,3944). Hipótese principal
    (zero como ingrediente principal) parcialmente confirmada; secundária confirmada no AgroPest (época 10 perto do E04)
    e no meio do caminho no IP102.
