# PROTOCOLO CONGELADO — Plano operacional do TCC (E01–E04 e ablação A01–A03).
# Congelado em 03/11/2026, ANTES de qualquer treino do plano. Não alterar entre experimentos.
# Atualizado em 04/11/2026: split final com as 13.143 imagens (quase-duplicatas fundidas aos grupos, nenhuma imagem descartada).
# Decisões do aluno em 03/11/2026: split agrupado; Copy-Paste/InstaBoost/FLOIA/CGOIA fora do escopo; 300 épocas.

dataset:
  nome: AgroPest-12 (Majumdar, 2025; Kaggle)
  split: data/processed/agropest12_plano   # 70/15/15, TODAS as 13.143 imagens, grupos = cópias Roboflow + quase-duplicatas (dHash<=3)
  imagens_treino_val_teste: [9209, 1967, 1967]
  fotos_originais_com_copias_em_mais_de_um_split: 0
  classes: 12
  seed_do_split: 51   # escolhida entre 42..51 só por estatística dos dados (menor desvio de instâncias por classe), sem usar modelos

experimentos:
  E01: {modelo: YOLOv8s,  pesos: yolov8s.pt,  aspe: false}
  E02: {modelo: YOLOv8s,  pesos: yolov8s.pt,  aspe: true}
  E03: {modelo: YOLO26s,  pesos: yolo26s.pt,  aspe: false}
  E04: {modelo: YOLO26s,  pesos: yolo26s.pt,  aspe: true}

treino:
  epochs: 300
  patience: 50            # monitora a fitness do Ultralytics (0,1*mAP50 + 0,9*mAP50-95) na VALIDAÇÃO
  imgsz: 640
  batch: 16               # nbs=64 -> acumulação de gradiente de 4 passos
  optimizer: AdamW        # momentum 0,937 é o beta1 do AdamW no Ultralytics
  lr0: 0.001              # escolhido no estudo de lr (docs/auditoria/estudo_lr_resultados.md); o artigo usava 0,01
  lrf: 0.01               # lr final = 0,00001 (cosseno); o estudo foi feito com lrf=0,01
  cos_lr: true
  warmup_epochs: 3
  weight_decay: 0.0005
  amp: true
  seed: 42
  deterministic: true
  workers: 2
  criterio_checkpoint: fitness padrão do Ultralytics, calculada na validação (nunca no teste)
  checkpoints: best.pt/last.pt (fp16, Ultralytics) e best_fp32.pt/last_fp32.pt (fp32, usado nas avaliações)

loss:                      # YOLOv8s
  box: 7.5                 # CIoU
  cls: 0.5                 # BCE
  dfl: 1.5                 # DFL (reg_max=16)
loss_yolo26: >
  O YOLO26s usa cabeça end-to-end sem DFL (reg_max=1) e, em avaliação, não usa NMS. Os ganhos box/cls/dfl
  do Ultralytics são os mesmos nominais, mas a componente DFL é substituída por L1 na parametrização sem DFL.
  Registrar no TCC que a linha 'DFL' vale apenas para o YOLOv8s. CORREÇÃO 09/11/2026: o treino e a avaliação de validação
  dos 4 modelos usam NMS externo (padrão nms=None); a cabeça end-to-end sem NMS (nms=False) é reportada à parte.

augmentation:              # A01 = referência. Apenas o que o pipeline de DETECÇÃO realmente executa.
  mosaic: 1.0
  close_mosaic: 50         # mosaic desligado nas últimas 50 épocas (a partir da época 251), como no artigo
  mixup: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 15.0
  translate: 0.1
  scale: 0.2               # fator aleatório em [0,8; 1,2]
  perspective: 0.0001
  fliplr: 0.5
  flipud: 0.5
  # erasing e auto_augment (RandAugment) só existem no pipeline de CLASSIFICAÇÃO do Ultralytics:
  # confirmado no código (data/augment.py, data/dataset.py: ClassificationDataset). Não atuam em detecção.
  # albumentations não está instalado; portanto nenhuma transformação adicional é aplicada.

avaliacao:
  decisoes: somente validação
  teste: uma única vez, ao final, com a configuração congelada
  half: false              # fp32 (as variâncias do BatchNorm excedem o limite do fp16 com lr 0,01)
  iou_nms: 0.7             # só YOLOv8s
  max_det: 300

ambiente:
  python: 3.9.13
  torch: 2.7.1+cu126
  cuda: "12.6"
  ultralytics: 8.4.165
  gpu: NVIDIA GeForce RTX 4060 Ti (8 GB)
  driver: "610.88"
  so: Windows 11
